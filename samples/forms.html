<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>폼 접근성 테스트 샘플</title>
  <link rel="stylesheet" href="./assets/css/sample.css">
</head>
<body>
  <header class="sample-header">
    <h1>폼과 접근 가능한 이름</h1>
    <p>label 연결, title 전용 이름, 여러 label, 중복 id와 ARIA 참조를 집중적으로 확인합니다.</p>
  </header>

  <main class="sample-main">
    <div class="sample-grid">
      <section class="sample-card sample-card--danger">
        <h2>항목명 누락</h2>
        <div class="sample-form">
          <input type="text" placeholder="이름">
          <textarea placeholder="문의 내용"></textarea>
          <select>
            <option>통신사를 선택하세요</option>
          </select>
        </div>
      </section>

      <section class="sample-card sample-card--danger">
        <h2>title로만 제공된 이름</h2>
        <div class="sample-form">
          <input type="text" title="고객번호">
          <input type="tel" title="휴대전화 번호">
        </div>
      </section>

      <section class="sample-card sample-card--danger">
        <h2>존재하지 않는 연결 대상</h2>
        <div class="sample-form">
          <label for="missing-user-id">사용자 아이디</label>
          <input id="user-id-real" type="text">
          <button type="button" aria-controls="missing-panel">상세 정보 열기</button>
          <input type="text" aria-labelledby="missing-label">
        </div>
      </section>

      <section class="sample-card sample-card--danger">
        <h2>여러 label과 중복 id</h2>
        <div class="sample-form">
          <label for="shared-field">첫 번째 항목명</label>
          <label for="shared-field">두 번째 항목명</label>
          <input id="shared-field" type="text">
          <label for="duplicate-radio">문자 수신</label>
          <input id="duplicate-radio" name="notice" type="radio">
          <label for="duplicate-radio">이메일 수신</label>
          <input id="duplicate-radio" name="notice" type="radio">
        </div>
      </section>

      <section class="sample-card sample-card--pass sample-card--wide">
        <h2>정상 폼 기준</h2>
        <form class="sample-form">
          <label for="full-name">이름</label>
          <input id="full-name" name="full-name" type="text" autocomplete="name">
          <fieldset>
            <legend>알림 수단</legend>
            <label><input name="channel" type="radio" value="sms"> 문자</label>
            <label><input name="channel" type="radio" value="email"> 이메일</label>
          </fieldset>
          <label for="region">거주 지역</label>
          <select id="region" name="region">
            <option value="">선택하세요</option>
            <option value="seoul">서울</option>
          </select>
          <button class="sample-button" type="submit">신청하기</button>
        </form>
      </section>
    </div>
  </main>
</body>
</html>

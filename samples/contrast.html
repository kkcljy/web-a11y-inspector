<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>색상 명도 대비 테스트 샘플</title>
  <link rel="stylesheet" href="./assets/css/sample.css">
</head>
<body>
  <header class="sample-header">
    <h1>색상 명도 대비</h1>
    <p>일반 텍스트, 큰 텍스트, 복합 배경과 정상 대비를 비교합니다.</p>
  </header>

  <main class="sample-main">
    <div class="sample-grid">
      <section class="sample-card sample-card--danger">
        <h2>낮은 일반 텍스트 대비</h2>
        <p class="contrast-low">흰색 배경의 밝은 회색 텍스트입니다. 일반 텍스트 4.5:1 기준을 충족하지 않습니다.</p>
      </section>

      <section class="sample-card sample-card--danger">
        <h2>낮은 큰 텍스트 대비</h2>
        <p class="contrast-low-large">큰 텍스트도 3:1 기준이 필요합니다.</p>
      </section>

      <section class="sample-card sample-card--danger">
        <h2>복합 배경 확인 필요</h2>
        <p class="contrast-image">배경 이미지와 그라데이션 위 텍스트는 자동 계산이 불완전할 수 있습니다.</p>
      </section>

      <section class="sample-card sample-card--pass">
        <h2>정상 대비</h2>
        <p class="contrast-pass">흰색 배경과 진한 텍스트로 충분한 명도 대비를 제공합니다.</p>
        <button class="sample-button" type="button">명확한 버튼</button>
      </section>
    </div>
  </main>
</body>
</html>
